<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision Assist</title>
<style>
:root{
  --bg:#0b0b10; --fg:#f4f4f6; --accent:#3d8bfd; --accent-active:#e5484d;
  --card:#16161d; --muted:#9a9aa5;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  min-height:100%;
}
h1{font-size:18px; font-weight:600; margin:8px 0 4px;}
.sub{color:var(--muted); font-size:13px; margin-bottom:12px; text-align:center;}
.settings{width:100%; max-width:480px; background:var(--card); border-radius:14px; padding:12px; margin-bottom:14px;}
.settings label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
.settings input, .settings select{
  width:100%; padding:10px; border-radius:8px; border:1px solid #2a2a33;
  background:#0f0f14; color:var(--fg); font-size:14px; margin-bottom:8px;
}
video{display:none;}
canvas{display:none;}
.stage{flex:1; width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
#btn{
  width:180px; height:180px; border-radius:50%; border:none;
  background:var(--accent); color:#fff; font-size:20px; font-weight:700;
  display:flex; align-items:center; justify-content:center; text-align:center;
  user-select:none; -webkit-user-select:none; touch-action:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  box-shadow:0 0 0 8px rgba(61,139,253,0.15);
  transition:background .15s, box-shadow .15s, transform .1s;
}
#btn.active{background:var(--accent-active); box-shadow:0 0 0 14px rgba(229,72,77,0.2); transform:scale(0.97);}
#btn.busy{background:#8a6d1f; box-shadow:0 0 0 8px rgba(138,109,31,0.2);}
#box{
  width:100%; min-height:140px; background:var(--card); border-radius:14px;
  padding:16px; font-size:16px; line-height:1.5; white-space:pre-wrap;
  overflow-y:auto; max-height:40vh;
}
#status{font-size:13px; color:var(--muted); min-height:18px;}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f4f4f6; --fg:#111; --card:#fff; --muted:#666; }
  .settings input,.settings select{ background:#f7f7f9; color:#111; border-color:#ddd; }
}
</style>
</head>
<body>
<h1>🦯 Vision Assist</h1>
<div class="sub">Press and hold the big button, ask your question, then release to send.</div>

<div class="settings">
  <label for="facing">Camera</label>
  <select id="facing">
    <option value="environment">Back camera</option>
    <option value="user">Front camera</option>
  </select>
</div>

<div class="stage">
  <button id="btn" aria-label="Hold to talk. Release to send your question.">Hold to<br>Talk</button>
  <div id="status" role="status" aria-live="polite">Ready</div>
  <div id="box" aria-live="polite">The answer will appear here…</div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const btn = document.getElementById('btn');
const box = document.getElementById('box');
const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const facingSelect = document.getElementById('facing');
const BACKEND_URL = 'https://vision-assist-backend-c6b9.onrender.com/analyze';

/* ---------- Tunables ---------- */
const MIN_HOLD_MS = 350;          // shorter than this = accidental touch, ignored
const STOP_WAIT_MS = 1500;        // max wait for the final speech result after release
const REQUEST_TIMEOUT_MS = 45000; // Render free tier can cold-start slowly
const MAX_HISTORY_TURNS = 3;      // last N exchanges kept for follow-ups
const HISTORY_TTL_MS = 2 * 60 * 1000; // forget context after 2 min of inactivity

/* ---------- Persisted setting ---------- */
try{ facingSelect.value = localStorage.getItem('va_facing') || 'environment'; }catch(e){}
facingSelect.addEventListener('change', ()=>{
  try{ localStorage.setItem('va_facing', facingSelect.value); }catch(e){}
  stopCamera(); // will be restarted with the new facing on next press
});

/* ---------- State ----------
   holding : finger/key is currently down
   session : incremented on every press; any async work from an older
             session checks this and quietly gives up (fixes races)
*/
let holding = false;
let session = 0;
let pressStart = 0;
let finalText = '';
let interimText = '';
let recognition = null;
let abortCtl = null;
let conversationHistory = [];
let lastActivity = 0;

function setStatus(t){ statusEl.textContent = t; }

/* ---------- Feedback: vibration + beep ---------- */
let audioCtx = null;
function beep(freq, ms = 90){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + ms / 1000);
  }catch(e){}
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ---------- Text to speech ---------- */
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}
function cancelOutput(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(abortCtl){ try{ abortCtl.abort(); }catch(e){} abortCtl = null; }
  btn.classList.remove('busy');
}

/* ---------- Camera ---------- */
let stream = null;
let streamFacing = null;
let cameraPromise = null;
let cameraGen = 0;

function ensureCamera(){
  const facing = facingSelect.value;
  const alive = stream && stream.getVideoTracks().some(t => t.readyState === 'live');
  if(alive && streamFacing === facing && cameraPromise) return cameraPromise;

  stopCamera();
  streamFacing = facing;
  const gen = ++cameraGen;
  cameraPromise = (async () => {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: {ideal: 640}, height: {ideal: 480} },
      audio: false
    });
    if(gen !== cameraGen){ s.getTracks().forEach(t => t.stop()); throw new Error('Camera restarted'); }
    stream = s;
    video.srcObject = s;
    await video.play();
  })();
  cameraPromise.catch(()=>{}); // avoid unhandled-rejection noise; callers handle errors themselves
  return cameraPromise;
}

function stopCamera(){
  cameraGen++;
  cameraPromise = null;
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

// Grab a frame right now (called at release, so it matches what the user was pointing at)
function captureFrame(){
  if(!video.videoWidth) return null;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.6).split(',')[1]; // no data-URL prefix
}

/* ---------- Speech recognition ---------- */
function startRecognition(mySession){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ setStatus('This browser does not support speech recognition. Please use Chrome.'); return; }

  const rec = new SR();
  recognition = rec;
  rec.lang = 'en-US';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event) => {
    if(recognition !== rec) return;
    let interim = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const r = event.results[i];
      if(r.isFinal) finalText += r[0].transcript + ' ';
      else interim += r[0].transcript;
    }
    interimText = interim;
    if(holding) setStatus('Listening: ' + (finalText + interim).trim());
  };

  rec.onerror = (e) => {
    if(e.error === 'no-speech' || e.error === 'aborted') return; // normal
    if(holding && session === mySession) setStatus('Speech recognition error: ' + e.error);
  };

  rec.onend = () => {
    if(rec._finish){ rec._finish(); return; }           // we asked it to stop (button released)
    if(holding && session === mySession && recognition === rec){
      // The browser ended it on its own (silence timeout etc.) while still holding: keep listening
      interimText = '';
      startRecognition(mySession);
    }
  };

  try{ rec.start(); }catch(e){ setStatus('Could not start microphone: ' + e.message); }
}

// Stop listening and resolve with the full transcript (waits briefly for the last final result)
function stopRecognitionAndCollect(){
  return new Promise(resolve => {
    const rec = recognition;
    const collect = () => (finalText + ' ' + interimText).trim();
    if(!rec){ resolve(collect()); return; }
    let done = false;
    let timer = null;
    const finish = () => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      if(recognition === rec) recognition = null;
      resolve(collect());
    };
    rec._finish = finish;
    timer = setTimeout(finish, STOP_WAIT_MS);
    try{ rec.stop(); }catch(e){ finish(); }
  });
}

function abortRecognition(){
  const rec = recognition;
  recognition = null;
  if(rec){ rec._finish = () => {}; try{ rec.abort(); }catch(e){} }
}

/* ---------- Press / release ---------- */
function startPress(){
  if(holding) return;              // ignore duplicate events (mouse+touch, key repeat)
  holding = true;
  const mySession = ++session;

  cancelOutput();                  // interrupt any speech / in-flight request from before
  abortRecognition();
  finalText = '';
  interimText = '';
  pressStart = Date.now();

  btn.classList.add('active');
  buzz(30); beep(880);
  setStatus('Listening…');

  startRecognition(mySession);     // start the mic immediately so no words are lost
  ensureCamera().catch(err => {    // camera warms up in parallel
    if(holding && session === mySession) setStatus('Camera access failed: ' + err.message);
  });
}

async function endPress(cancel = false){
  if(!holding) return;
  holding = false;
  const mySession = session;
  btn.classList.remove('active');
  buzz(30); beep(440);

  if(cancel){
    abortRecognition();
    setStatus('Cancelled');
    return;
  }
  if(Date.now() - pressStart < MIN_HOLD_MS){
    abortRecognition();
    setStatus('Too short. Hold the button while you speak.');
    speak('Hold the button while you speak.');
    return;
  }

  btn.classList.add('busy');
  setStatus('Processing…');
  const text = await stopRecognitionAndCollect();
  if(session !== mySession) return;  // a new press started meanwhile

  if(!text){
    btn.classList.remove('busy');
    setStatus('Nothing heard');
    box.textContent = 'I did not catch that. Please try again.';
    speak('I did not catch that. Please try again.');
    return;
  }

  // Frame at release time; if the camera was still warming up, wait a moment for it
  let frame = captureFrame();
  if(!frame && cameraPromise){
    try{
      await Promise.race([cameraPromise, new Promise((_, rej) => setTimeout(() => rej(new Error('Camera timeout')), 4000))]);
      if(session !== mySession) return;
      await new Promise(r => setTimeout(r, 150)); // let the first frame render
      frame = captureFrame();
    }catch(e){}
  }
  if(session !== mySession) return;
  if(!frame){
    btn.classList.remove('busy');
    setStatus('Camera not ready');
    box.textContent = 'Camera is not available. Please allow camera access and try again.';
    speak('Camera is not available.');
    return;
  }

  await askBackend(text, frame, mySession);
}

async function askBackend(text, frame, mySession){
  box.textContent = 'You said: ' + text + '\n\nAnalyzing…';
  setStatus('Analyzing the scene…');

  if(Date.now() - lastActivity > HISTORY_TTL_MS) conversationHistory = [];
  const prompt = text + '. I am blind. Give me one clear, actionable instruction.';

  const ctl = new AbortController();
  abortCtl = ctl;
  const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);

  try{
    const resp = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, image_base64: frame, history: conversationHistory }),
      signal: ctl.signal
    });
    const data = await resp.json();
    if(session !== mySession) return;

    if(!resp.ok){
      const msg = data.detail || 'Unknown error';
      box.textContent = 'Error: ' + msg;
      setStatus('Request failed');
      speak('Error. ' + msg);
    } else {
      const answer = (data.answer || '(No response received)').trim();
      box.textContent = 'You said: ' + text + '\n\nAnswer: ' + answer;
      setStatus('Done');
      speak(answer);

      conversationHistory.push({ role: 'user', text: prompt });
      conversationHistory.push({ role: 'model', text: answer });
      const maxEntries = MAX_HISTORY_TURNS * 2;
      if(conversationHistory.length > maxEntries){
        conversationHistory = conversationHistory.slice(-maxEntries);
      }
      lastActivity = Date.now();
    }
  }catch(e){
    if(session !== mySession) return;   // aborted because the user pressed again: stay silent
    const msg = e.name === 'AbortError' ? 'The request timed out.' : 'Network error: ' + e.message;
    box.textContent = msg;
    setStatus('Request failed');
    speak(msg);
  }finally{
    clearTimeout(timer);
    if(abortCtl === ctl) abortCtl = null;
    if(session === mySession) btn.classList.remove('busy');
  }
}

/* ---------- Input wiring ---------- */
// Pointer events cover mouse, touch and pen with a single code path
btn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try{ btn.setPointerCapture(e.pointerId); }catch(_){}  // still get pointerup if the finger slides off
  startPress();
});
btn.addEventListener('pointerup', () => endPress(false));
btn.addEventListener('pointercancel', () => endPress(true));
btn.addEventListener('lostpointercapture', () => endPress(false)); // safety net, no-op if already released
btn.addEventListener('contextmenu', (e) => e.preventDefault());

// Keyboard: hold Space (ignored while the camera dropdown is focused)
function isFormField(t){ return t && (t.tagName === 'SELECT' || t.tagName === 'INPUT'); }
window.addEventListener('keydown', (e) => {
  if(e.code !== 'Space' || isFormField(e.target)) return;
  e.preventDefault();
  if(!e.repeat) startPress();
});
window.addEventListener('keyup', (e) => {
  if(e.code !== 'Space' || isFormField(e.target)) return;
  e.preventDefault();
  endPress(false);
});

// Interruptions: cancel instead of sending half a question
window.addEventListener('blur', () => endPress(true));
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    endPress(true);
    cancelOutput();
    stopCamera();   // free the camera when the page is in the background
  }
});
</script>
</body>
</html>
